<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Contact · Anteon</title>
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Anteon" />
  <meta property="og:title" content="Anteon" />
  <meta property="og:description" content="If I have seen further, it is by standing on the shoulders of Giants." />
  <meta property="og:url" content="https://sikaidemo.com/" />
  <meta property="og:image" content="https://sikaidemo.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Anteon" />
  <meta name="twitter:description" content="If I have seen further, it is by standing on the shoulders of Giants." />
  <meta name="twitter:image" content="https://sikaidemo.com/og-image.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/logo/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/logo/favicon-16.png" />
  <link rel="apple-touch-icon" href="/logo/apple-touch.png" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/hanken-grotesk-latin.woff2" />
  <script>
    /* Theme before first paint, so the shell never flashes the wrong ground:
       a stored light or dark wins, and anything else follows the OS. */
    try {
      var t = localStorage.getItem('anteon-theme');
      document.documentElement.setAttribute('data-theme', t === 'light' || t === 'dark' ? t : 'system');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'system');
    }
  </script>
  <link rel="stylesheet" href="/src/tokens.css" />
  <link rel="stylesheet" href="/src/page.css" />
  <link rel="stylesheet" href="/src/chrome.css" />
</head>
<body>
  <header id="site-header"></header>
  <main class="page-main">
    <h1>Contact</h1>
    <div class="contact-grid">
      <div class="contact-intro">
        <p class="contact-lede">Tell us what you&rsquo;re building and where deterministic behavior matters most. A short note about the system and the decisions it makes is enough to start.</p>
        <div class="contact-alt">
          <span class="contact-alt-label">Prefer a call?</span>
          <p class="contact-alt-text"><button type="button" class="contact-here">Book one here</button></p>
        </div>
      </div>
      <form class="contact-form">
        <div class="field">
          <label for="contact-name">Name</label>
          <input id="contact-name" name="name" type="text" autocomplete="name" required />
        </div>
        <div class="field">
          <label for="contact-email">Work email</label>
          <input id="contact-email" name="email" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="contact-company">Company</label>
          <input id="contact-company" name="company" type="text" autocomplete="organization" required />
        </div>
        <div class="field">
          <label for="contact-message">Message</label>
          <textarea id="contact-message" name="message" required></textarea>
        </div>
        <button type="submit" class="contact-submit">
          <span class="cs-label">Send message</span>
          <span class="cs-arrow" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></span>
        </button>
        <p class="contact-status" role="status" aria-live="polite" hidden></p>
      </form>
    </div>
    <script>
      // Contact form interactions. No backend is wired yet, so this validates
      // the fields and confirms optimistically. When an endpoint exists, swap
      // the success call below for a real POST and report its result here.
      (function () {
        var form = document.querySelector('.contact-form');
        var status = document.querySelector('.contact-status');
        if (!form || !status) return;

        var nameEl = document.getElementById('contact-name');
        var emailEl = document.getElementById('contact-email');
        var companyEl = document.getElementById('contact-company');
        var messageEl = document.getElementById('contact-message');
        if (!nameEl || !emailEl || !companyEl || !messageEl) return;

        var fields = [
          { el: nameEl, label: 'name' },
          { el: emailEl, label: 'work email' },
          { el: companyEl, label: 'company' },
          { el: messageEl, label: 'message' }
        ];

        var submitEl = form.querySelector('.contact-submit');
        var labelEl = form.querySelector('.cs-label');

        // Success lives in the button itself: the same box turns to the
        // success tint and carries the confirmation. Typing anything new
        // reopens the form and the button goes back to sending.
        function sent(message) {
          status.hidden = true;
          if (!submitEl || !labelEl) return;
          submitEl.classList.add('is-sent');
          submitEl.disabled = true;
          labelEl.textContent = message;
        }

        form.addEventListener('input', function () {
          if (!submitEl || !submitEl.classList.contains('is-sent')) return;
          submitEl.classList.remove('is-sent');
          submitEl.disabled = false;
          if (labelEl) labelEl.textContent = 'Send message';
        });

        // A deliberately simple shape check: some characters, an at sign, a
        // dotted domain. It catches empty and obviously wrong addresses
        // without rejecting valid ones the server would accept.
        var emailPattern = /^\S+@\S+\.\S+$/;

        function show(kind, message) {
          status.classList.remove('is-success', 'is-error');
          status.classList.add(kind === 'success' ? 'is-success' : 'is-error');
          status.textContent = message;
          status.hidden = false;
        }

        function joinLabels(items) {
          if (items.length === 1) return items[0];
          if (items.length === 2) return items[0] + ' and ' + items[1];
          return items.slice(0, -1).join(', ') + ', and ' + items[items.length - 1];
        }

        form.addEventListener('submit', function (event) {
          event.preventDefault();

          var missing = [];
          var firstInvalid = null;
          fields.forEach(function (field) {
            var empty = field.el.value.trim() === '';
            field.el.setAttribute('aria-invalid', empty ? 'true' : 'false');
            if (empty) {
              missing.push(field.label);
              if (!firstInvalid) firstInvalid = field.el;
            }
          });

          if (missing.length) {
            show('error', "You're missing your " + joinLabels(missing) + '.');
            if (firstInvalid) firstInvalid.focus();
            return;
          }

          if (!emailPattern.test(emailEl.value.trim())) {
            emailEl.setAttribute('aria-invalid', 'true');
            show('error', "That work email doesn't look right. Please check it and try again.");
            emailEl.focus();
            return;
          }

          sent("Your message is sent. We'll reply within one business day.");
          form.reset();
          fields.forEach(function (field) {
            field.el.setAttribute('aria-invalid', 'false');
          });
        });
      })();
    </script>
  </main>
  <footer class="site-footer"></footer>
  <script type="module" src="/src/page.ts"></script>
</body>
</html>
