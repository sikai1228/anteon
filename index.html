<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Layer2</title>
  <meta name="description" content="If I have seen further, it is by standing on the shoulders of Giants." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0b0d'/%3E%3Cpath d='M4 12 Q8 3 12 12' stroke='%23eceae4' stroke-width='1.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <header id="chrome">
    <span id="wordmark">Layer2</span>
    <nav class="header-nav">
      <a href="#">Product</a>
      <a href="#">Pricing</a>
      <a href="#">Support</a>
      <button type="button" class="book-call"><span class="bc-label">Book a call</span><span class="bc-arrow" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></span></button>
    </nav>
  </header>
  <div id="film" style="height: 1400vh">
    <div id="stage">
      <canvas id="gl" aria-hidden="true"></canvas>
      <div id="fade" aria-hidden="true"></div>
      <div id="captions"></div>
      <figure id="quote">
        <blockquote>&ldquo;If I have seen further, it is by standing on the shoulders of Giants.&rdquo;</blockquote>
        <figcaption>&mdash;&nbsp;Sir Isaac Newton</figcaption>
      </figure>
      <button id="skip" type="button">
        <span class="skip-label">Skip the film</span>
        <span class="skip-key" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg></span>
      </button>
    </div>
  </div>
  <main id="site">
    <div id="site-header">
      <span class="site-wordmark">Layer2</span>
      <nav class="header-nav">
        <a href="#">Product</a>
        <a href="#">Pricing</a>
        <a href="#">Support</a>
        <button type="button" class="book-call"><span class="bc-label">Book a call</span><span class="bc-arrow" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></span></button>
      </nav>
    </div>
    <h1 id="logo">Layer2</h1>
    <p id="site-note">The site begins here.</p>
  </main>
  <script type="module" src="/src/main.ts"></script>
  <script type="module" src="/src/lib/chrome.ts"></script>
</body>
</html>
