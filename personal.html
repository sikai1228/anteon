  <script>
    /* Theme before first paint, so the shell never flashes the wrong ground:
       a stored light or dark wins, and anything else follows the OS. */
    try {
      var t = localStorage.getItem('anteon-theme');
      document.documentElement.setAttribute('data-theme', t === 'light' || t === 'dark' ? t : 'system');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'system');
    }
  </script>
